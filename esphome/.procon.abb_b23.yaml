#    device_class: frequency
#    unit_of_measurement: "Hz"
#    state_class: measurement
#    filters:
#      - multiply: 0.01

  ## 3.5 Vermogensfactor (-)

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Power factor total"
    address: 0x5B3A
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 3
    device_class: power_factor
    unit_of_measurement: ""
    state_class: measurement
    filters:
      - multiply: 0.001
