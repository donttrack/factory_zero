#### ABB B23 3-phase kWh Meter — geoptimaliseerd voor ESPHome 2026.5+ ####
#

modbus_controller:
  - id: B23
    address: 3
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 33s
    command_throttle: 500ms
    offline_skip_updates: 3

sensor:

  ## ── 1. Totale energie (kWh) ──────────────────────────────────────────────
  ## Langzaam veranderend: elke 3 cycli lezen (≈ 99 s)

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Import energy total"
    address: 0x5000
    register_type: holding
    value_type: U_QWORD
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    state_class: total_increasing
    skip_updates: 3
    filters:
      - multiply: 0.01

#  - platform: modbus_controller
#    modbus_controller_id: B23
#    name: "B23 Export energy total"
#    address: 0x5004
#    register_type: holding
#    value_type: U_QWORD
#    device_class: energy
#    unit_of_measurement: "kWh"
#    accuracy_decimals: 2
#    state_class: total_increasing
#    skip_updates: 3
#    filters:
#     - multiply: 0.01

  ## ── 2. Energie per fase ──────────────────────────────────────────────────
  ## force_new_range: true — registers liggen ver van 0x5000/0x5004 vandaan;
  ## voorkom dat de controller ze in één grote (onsuccesvolle) bulk-read probeert.

  ## Active import per fase

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Import energy L1"
    address: 0x5460
    register_type: holding
    value_type: U_QWORD
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    state_class: total_increasing
    skip_updates: 3
    force_new_range: true
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 999999.0   # verwerp absurde spikes; past bij de levensduur van een meter

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Import energy L2"
    address: 0x5464
    register_type: holding
    value_type: U_QWORD
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    state_class: total_increasing
    skip_updates: 3
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 999999.0

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Import energy L3"
    address: 0x5468
    register_type: holding
    value_type: U_QWORD
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    state_class: total_increasing
    skip_updates: 3
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 999999.0

  ## Active export per fase

#  - platform: modbus_controller
#    modbus_controller_id: B23
#    name: "B23 Export energy L1"
#    address: 0x546C
#    register_type: holding
#    value_type: U_QWORD
#    device_class: energy
#    unit_of_measurement: "kWh"
#    accuracy_decimals: 2
#   state_class: total_increasing
#    skip_updates: 3
#    filters:
#      - multiply: 0.01
#      - clamp:
#         min_value: 0.0
#          max_value: 999999.0

 # - platform: modbus_controller
 #   modbus_controller_id: B23
 #   name: "B23 Export energy L2"
#    address: 0x5470
#    register_type: holding
#    value_type: U_QWORD
#    device_class: energy
#    unit_of_measurement: "kWh"
#    accuracy_decimals: 2
#    state_class: total_increasing
#    skip_updates: 3
#    filters:
#      - multiply: 0.01
#      - clamp:
#          min_value: 0.0
#          max_value: 999999.0

#  - platform: modbus_controller
#    modbus_controller_id: B23
#    name: "B23 Export energy L3"
#    address: 0x5474
#    register_type: holding
#    value_type: U_QWORD
#    device_class: energy
#    unit_of_measurement: "kWh"
#    accuracy_decimals: 2
#    state_class: total_increasing
#    skip_updates: 3
#    filters:
#      - multiply: 0.01
#      - clamp:
#          min_value: 0.0
#          max_value: 999999.0

  ## ── 3. Momentane waarden ─────────────────────────────────────────────────
  ## Elke cyclus lezen (skip_updates: 0 is de standaard, hoeft niet vermeld).
  ## force_new_range: true op de eerste sensor van dit blok (0x5B00 is een
  ## nieuwe range t.o.v. 0x546x).

  ## 3.1 Spanning (V)

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Voltage L1-N"
    address: 0x5B00
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    force_new_range: true
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Voltage L2-N"
    address: 0x5B02
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Voltage L3-N"
    address: 0x5B04
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    filters:
      - multiply: 0.1

  ## 3.2 Stroom (A)

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Current L1"
    address: 0x5B0C
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    device_class: current
    unit_of_measurement: "A"
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Current L2"
    address: 0x5B0E
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    device_class: current
    unit_of_measurement: "A"
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Current L3"
    address: 0x5B10
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    device_class: current
    unit_of_measurement: "A"
    state_class: measurement
    filters:
      - multiply: 0.01

  ## 3.3 Actief vermogen (W)

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Power total"
    address: 0x5B14
    register_type: holding
    value_type: S_DWORD
    accuracy_decimals: 2
    device_class: power
    unit_of_measurement: "W"
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Power L1"
    address: 0x5B16
    register_type: holding
    value_type: S_DWORD
    accuracy_decimals: 2
    device_class: power
    unit_of_measurement: "W"
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Power L2"
    address: 0x5B18
    register_type: holding
    value_type: S_DWORD
    accuracy_decimals: 2
    device_class: power
    unit_of_measurement: "W"
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: B23
    name: "B23 Power L3"
    address: 0x5B1A
    register_type: holding
    value_type: S_DWORD
    accuracy_decimals: 2
    device_class: power
    unit_of_measurement: "W"
    state_class: measurement
    filters:
      - multiply: 0.01

  ## 3.4 Frequentie (Hz)

#  - platform: modbus_controller
#    modbus_controller_id: B23
